<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Contacto | DINO-MUSEO</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<header class="site-header">
  <a href="admin.html">
    <h1>DINO-MUSEO</h1>
  </a>

  <nav class="main-nav">
    <ul>
      <li>
        <a href="admin.html" class="active">
          Panel de Administración
        </a>
      </li>

      <li>
        <a href="../index.html">
          Volver al sitio
        </a>
      </li>
    </ul>
  </nav>
</header>

<main>

  <section class="hero">
    <h2>Ver contacto</h2>
    <p>Información del mensaje recibido desde el formulario de contacto.</p>
  </section>

  <section class="admin-formulario">

    <h2 id="tituloContacto">Contacto recibido</h2>

    <div class="campo">
      <label>Nombre</label>
      <input type="text" id="nombreContacto" readonly>
    </div>

    <div class="campo">
      <label>Correo electrónico</label>
      <input type="email" id="correoContacto" readonly>
    </div>

    <div class="campo">
      <label>Fecha</label>
      <input type="text" id="fechaContacto" readonly>
    </div>

    <div class="campo">
      <label>Mensaje</label>
      <textarea id="mensajeContacto" rows="6" readonly></textarea>
    </div>

    <div class="admin-formulario-acciones">
      <a href="admin.html" class="btn-primario">Volver a contactos</a>
    </div>
  </section>
</main>

<footer>
  <p>2026 DINO-MUSEO. Todos los derechos reservados.</p>
</footer>

<script type="module" src="../js/app.js"></script>

</body>
</html>
