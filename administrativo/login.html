<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | DINO-MUSEO</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script type="module" src="../js/app.js"></script>
</head>
<body>

  <header class="site-header">
    <a href="../index.html"><h1>DINO-MUSEO</h1></a>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="../exposicion.html">Exposición</a></li>
        <li><a href="../horarios.html">Horarios y Precios</a></li>
        <li><a href="../contacto.html">Contacto y Reservas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="admin-formulario" style="max-width: 450px;">
      <h2>Iniciar sesión como administrador</h2>
      <p style="color: var(--c-secundario); margin-bottom: 1.5rem;">Ingresa tu usuario y contraseña para acceder al panel administrativo.</p>

      <form id="formLogin" novalidate>
        
        <div class="campo">
          <label for="loginCorreo">Correo Electrónico</label>
          <div class="campo-control">
            <input type="text" id="loginCorreo" autocomplete="email" placeholder="nombre@correo.cl">
            <span class="icono-error">X</span>
          </div>
          <p class="mensaje-error"></p>
        </div>

        <div class="campo">
          <label for="loginPassword">Contraseña</label>
          <div class="campo-control">
            <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
            <span class="icono-error">X</span>
          </div>
          <p class="mensaje-error"></p>
        </div>

        <div class="admin-formulario-acciones" style="justify-content: flex-start; margin-top: 1rem;">
          <button type="submit" class="btn-primario" id="btnIngresar">Ingresar</button>
        </div>

        <p id="outLogin" class="hint" style="margin-top: 1rem;"></p>

      </form>
    </section>
  </main>

  <footer>
    <p>2026 DINO-MUSEO. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
